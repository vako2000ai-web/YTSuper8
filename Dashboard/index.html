<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Roller Coaster Control</title>
<style>body{background:#101d36;color:#eef4ff;font:16px system-ui;margin:0}main{max-width:1000px;margin:auto;padding:32px}h1{color:#ffce49}.panel{background:#203456;border-radius:16px;padding:20px;margin:14px 0}button{padding:10px 18px;border:0;border-radius:8px;background:#ffce49;font-weight:bold;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #456}small{color:#a9bfe6}</style></head><body><main><h1>🎢 Roller Coaster Control</h1><p>Development dashboard — USD only • English broadcast graphics</p><div class="panel"><h2>Backend status</h2><div id="status">Checking local API…</div></div><div class="panel"><h2>Characters</h2><div id="characters">Loading…</div></div><div class="panel"><h2>First Ride</h2><p>Open Unity and press Play. R = restart, M = mute music.</p><small>DonationAlerts and OBS integration are not active in this prototype.</small></div></main><script>
const api='http://127.0.0.1:8000';
async function load(){try{const [h,c]=await Promise.all([fetch(api+'/health'),fetch(api+'/characters')]);if(!h.ok||!c.ok)throw Error('Backend unavailable');let health=await h.json(),characters=await c.json();document.querySelector('#status').textContent=health.status.toUpperCase()+' — donation provider not connected';document.querySelector('#characters').innerHTML='<table><tr><th>#</th><th>Hero</th></tr>'+characters.map(x=>'<tr><td>'+x.id+'</td><td>'+x.name+'</td></tr>').join('')+'</table>'}catch(e){document.querySelector('#status').textContent='Start the Python backend on port 8000';document.querySelector('#characters').textContent='No data loaded';}}load();
</script></body></html>
